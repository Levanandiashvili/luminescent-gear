# www.luminescentmastering.com goes to the bare domain, the site's one address.
server {
    listen 8080;
    server_name www.luminescentmastering.com;
    return 301 https://luminescentmastering.com$request_uri;
}

server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Railway's proxy sits in front, so redirects stay relative (no internal host or port).
    absolute_redirect off;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "public, max-age=300" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ @home;
    }

    # Old or mistyped links go to the home page.
    location @home {
        return 301 /;
    }
}
